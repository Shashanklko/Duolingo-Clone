services:
  # ─── 1. Python FastAPI Backend Service ──────────────────────────────────────
  - type: web
    name: duolingo-clone-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python populate_from_scaffold.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # ─── 2. Next.js 16 Frontend Service ─────────────────────────────────────────
  - type: web
    name: duolingo-clone-frontend
    env: node
    region: oregon
    plan: free
    rootDir: client
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://duolingo-clone-backend.onrender.com/api"
