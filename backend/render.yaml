services:
  - type: web
    name: duolingo-clone-backend
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt && python populate_from_scaffold.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
